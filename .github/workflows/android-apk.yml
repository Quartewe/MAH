name: Android APK

on:
  workflow_dispatch:
    inputs:
      uiapp_ref:
        description: "MAH-UIApp branch, tag, or commit"
        default: main
      resource_ref:
        description: "mah_res branch or tag"
        default: main
      resource_repo:
        description: "External resource repository (owner/repo)"
        default: quartawa/mah_res
      resource_path:
        description: "Optional directory inside the resource repository"
        default: ''
      version:
        description: "APK version (empty generates a CI version)"
        required: false
  workflow_call:
    inputs:
      uiapp_ref:
        type: string
        default: main
      resource_ref:
        type: string
        default: main
      resource_repo:
        type: string
        default: quartawa/mah_res
      resource_path:
        type: string
        default: ''
      version:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout MAH
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false
          path: MAH
      - name: Checkout Android app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Quartewe/MAH-UIApp
          ref: ${{ inputs.uiapp_ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
          path: MAH-UIApp
      - name: Checkout resources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ inputs.resource_repo || 'quartawa/mah_res' }}
          ref: ${{ inputs.resource_ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false
          path: mah_res
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            MAH-UIApp/**/*.gradle.kts
            MAH-UIApp/gradle/libs.versions.toml
            MAH-UIApp/gradle/wrapper/gradle-wrapper.properties
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Prepare Android SDK
        run: |
          # API 37's published SDK package includes the minor version suffix.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platforms;android-37.0" "build-tools;37.0.0" "cmake;3.22.1"
      - name: Resolve APK version
        id: version
        working-directory: MAH
        shell: python
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          import os
          import re
          import subprocess

          version = os.environ.get("INPUT_VERSION", "").strip()
          if not version:
              base = subprocess.check_output(
                  ["git", "describe", "--tags", "--always", "--match", "v*"], text=True
              ).strip()
              version = f"{base}-android.ci.{os.environ['GITHUB_RUN_NUMBER']}.{os.environ['GITHUB_RUN_ATTEMPT']}"
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]*", version):
              raise SystemExit("Version must contain only letters, numbers, dots, underscores, + or -")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
          print(f"APK version: {version}")
      - name: Restore APK signing key
        shell: python
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          import base64
          import os
          from pathlib import Path

          names = ("KEYSTORE_BASE64", "KEYSTORE_PASSWORD", "KEY_ALIAS", "KEY_PASSWORD")
          missing = ["ANDROID_" + name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Secrets: " + ", ".join(missing))
          key = base64.b64decode("".join(os.environ["KEYSTORE_BASE64"].split()), validate=True)
          path = Path(os.environ["RUNNER_TEMP"]) / "mah-signing.jks"
          path.write_bytes(key)
          path.chmod(0o600)
      - name: Build universal debug APK
        working-directory: MAH-UIApp
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RESOURCE_PATH: ${{ inputs.resource_path }}
          GITHUB_TOKEN: ${{ github.token }}
          MAH_CI_DEBUG_SIGNING: 'true'
          KEYSTORE_PATH: ${{ runner.temp }}/mah-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python scripts/build_mah.py --mah ../MAH --resources "../mah_res/$RESOURCE_PATH" --abi all --version "$VERSION"
      - name: Verify APK signing certificate
        shell: python
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/mah-signing.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess

          certificate = subprocess.check_output([
              "keytool", "-exportcert", "-keystore", os.environ["KEYSTORE_PATH"],
              "-storepass:env", "KEYSTORE_PASSWORD", "-alias", os.environ["KEY_ALIAS"],
          ])
          expected = hashlib.sha256(certificate).hexdigest()
          tool = Path(os.environ["ANDROID_HOME"]) / "build-tools/37.0.0/apksigner"
          if os.name == "nt":
              tool = tool.with_suffix(".bat")
          report = subprocess.check_output([
              str(tool), "verify", "--print-certs",
              "MAH-UIApp/app/build/outputs/apk/debug/app-debug.apk",
          ], text=True)
          # Build Tools 37 reports each scheme as "V2 Signer", "V3 Signer", etc.
          # Older versions use "Signer #1". One certificate may appear in multiple schemes.
          digests = re.findall(
              r"^(?:Signer #\d+|V\d+(?:\.\d+)? Signer)[^\r\n]*?"
              r" certificate SHA-256 digest: ([0-9a-fA-F]{64})[ \t\r]*$",
              report, re.MULTILINE,
          )
          actual = {digest.lower() for digest in digests}
          if not actual:
              raise SystemExit("No APK signing certificate SHA-256 digest found in apksigner output")
          if actual != {expected}:
              raise SystemExit(
                  "APK signing certificate does not match the configured keystore: "
                  f"expected {expected}, actual {', '.join(sorted(actual))}"
              )
          print("APK signing certificate verified: " + expected)
      - name: Remove APK signing key
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          (Path(os.environ["RUNNER_TEMP"]) / "mah-signing.jks").unlink(missing_ok=True)
      - name: Prepare Android deliverables
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist/android
          cp MAH-UIApp/app/build/outputs/apk/debug/app-debug.apk "dist/android/MAH-android-universal-$VERSION-debug.apk"
          cp "MAH/build/android/MAH-project-android-$VERSION.zip" dist/android/
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MAH-Android-APK
          path: dist/android/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload project update package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MAH-Android-project
          path: dist/android/MAH-project-android-*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
