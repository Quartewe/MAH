name: Android project package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Project version for the standalone artifact"
        required: true
      resource_ref:
        description: "mah_res branch or tag"
        default: main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: quartawa/mah_res
          ref: ${{ inputs.resource_ref || 'main' }}
          fetch-depth: 0
          path: mah_res
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Stage Android project
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
        run: python tools/build_android.py --resources mah_res --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: MAH-Android-project
          path: build/android/MAH-project-android-*.zip
