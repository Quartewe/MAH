name: install

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      resource_repo:
        description: "External resource repo (owner/repo), leave empty to disable"
        required: false
        default: "quartawa/mah_res"
      resource_ref:
        description: "External resource branch or tag"
        required: false
        default: "main"
      resource_path:
        description: "Path inside external repo to sync to assets/resource"
        required: false
        default: "assets/resource"

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}

  install:
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [win, macos, linux, android]
        arch: [aarch64, x86_64]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1
        with:
          repository: MaaXYZ/MaaFramework
          fileName: "MAA-${{ matrix.os }}-${{ matrix.arch }}*"
          latest: true
          out-file-path: "deps"
          extract: true

      - name: Sync external resource repository (full package)
        id: sync_resource
        shell: bash
        env:
          INPUT_RESOURCE_REPO: ${{ github.event.inputs.resource_repo }}
          INPUT_RESOURCE_REF: ${{ github.event.inputs.resource_ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "resource_version=" >> "$GITHUB_OUTPUT"
          DEFAULT_RESOURCE_REPO="quartawa/mah_res"

          RESOURCE_REPO="$INPUT_RESOURCE_REPO"
          if [[ -z "$RESOURCE_REPO" ]]; then
            RESOURCE_REPO="$DEFAULT_RESOURCE_REPO"
          fi

          echo "Downloading full resources from $RESOURCE_REPO"
          mkdir -p assets/resource

          RESOURCE_REF="$INPUT_RESOURCE_REF"
          if [[ -z "$RESOURCE_REF" || "$RESOURCE_REF" == "main" ]]; then
            RELEASE_API="https://api.github.com/repos/$RESOURCE_REPO/releases/latest"
            echo "Using latest release from $RESOURCE_REPO"
          else
            RELEASE_API="https://api.github.com/repos/$RESOURCE_REPO/releases/tags/$RESOURCE_REF"
            echo "Using specified release tag '$RESOURCE_REF' from $RESOURCE_REPO"
          fi

          RELEASE_JSON=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$RELEASE_API" || true)
          if [[ -z "$RELEASE_JSON" ]]; then
            echo "[WARNING] Failed to fetch release metadata from $RELEASE_API, keep local assets unchanged"
            exit 0
          fi

          RESOURCE_VERSION_TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          if [[ -n "$RESOURCE_VERSION_TAG" ]]; then
            echo "resource_version=$RESOURCE_VERSION_TAG" >> "$GITHUB_OUTPUT"
          fi

          # 仅查找 full 包，不使用 hotfix/incremental/patch
          PACKAGE_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | contains("full")) | .browser_download_url' | head -1)

          if [[ -z "$PACKAGE_URL" ]]; then
            # 最后兜底：任意 zip/tar.gz，且排除 hotfix/incremental/patch
            PACKAGE_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".zip") or endswith(".tar.gz")) | select((.name | contains("hotfix") or contains("incremental") or contains("patch")) | not) | .browser_download_url' | head -1)
          fi

          if [[ -z "$PACKAGE_URL" ]]; then
            echo "[WARNING] No resource package found in releases, keep local assets unchanged"
            exit 0
          fi

          echo "Downloading from: $PACKAGE_URL"
          TEMP_PACKAGE="/tmp/mah_res_package.$(echo $PACKAGE_URL | grep -oE '\.[^.]+$' | tr -d '.')"
          curl -L -H "Authorization: token $GITHUB_TOKEN" -o "$TEMP_PACKAGE" "$PACKAGE_URL"

          if [[ ! -f "$TEMP_PACKAGE" ]]; then
            echo "[ERROR] Failed to download resource package"
            exit 1
          fi

          # 解压到 assets/resource（不删除本地已有文件，只增量更新）
          if [[ "$TEMP_PACKAGE" == *.zip ]]; then
            unzip -o -q "$TEMP_PACKAGE" -d "assets/resource/"
          elif [[ "$TEMP_PACKAGE" == *.tar.gz ]]; then
            tar -xzf "$TEMP_PACKAGE" -C "assets/resource/"
          fi

          # 兼容旧资源包结构：统一归并到 assets/resource/base
          # image 应位于 base/image（不能打散到 base 根目录）
          if [[ -d "assets/resource/image" ]]; then
            mkdir -p assets/resource/base/image
            rsync -a "assets/resource/image/" "assets/resource/base/image/"
            rm -rf "assets/resource/image"
          fi

          # 旧包可能将 model/pipeline 放在 resource 根目录，归并到 base 下
          if [[ -d "assets/resource/model" ]]; then
            mkdir -p assets/resource/base/model
            rsync -a "assets/resource/model/" "assets/resource/base/model/"
            rm -rf "assets/resource/model"
          fi

          if [[ -d "assets/resource/pipeline" ]]; then
            mkdir -p assets/resource/base/pipeline
            rsync -a "assets/resource/pipeline/" "assets/resource/base/pipeline/"
            rm -rf "assets/resource/pipeline"
          fi

          rm -f "$TEMP_PACKAGE"
          echo "Resources synced successfully (full package mode)"

      - name: Download MAH-UI (new naming)
        if: matrix.os != 'android'
        id: download_mfa
        uses: robinraju/release-downloader@v1
        continue-on-error: true
        with:
          repository: Quartewe/MAH-UI
          fileName: "MAHUI-${{ matrix.os }}-${{ matrix.arch }}-*"
          latest: true
          out-file-path: "MFA"
          extract: true

      - name: Download MAH-UI (legacy fallback)
        if: matrix.os != 'android' && steps.download_mfa.outcome == 'failure'
        id: download_mfa_legacy
        uses: robinraju/release-downloader@v1
        with:
          repository: Quartewe/MAH-UI
          fileName: "MFW-PyQt6-${{ matrix.os }}-${{ matrix.arch }}-*"
          latest: true
          out-file-path: "MFA"
          extract: true

      - name: Clean up MAH-UI archive
        if: matrix.os != 'android'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOWNLOAD_FILES='${{ steps.download_mfa.outputs.downloaded_files }}'
          if [[ -z "$DOWNLOAD_FILES" || "$DOWNLOAD_FILES" == '[]' ]]; then
            DOWNLOAD_FILES='${{ steps.download_mfa_legacy.outputs.downloaded_files }}'
          fi
          ARCHIVE_FILE_PATH="$(echo "$DOWNLOAD_FILES" | jq -r '.[0]')"

          UI_RELEASE_JSON="$(curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" https://api.github.com/repos/Quartewe/MAH-UI/releases/latest || true)"
          UI_VERSION="$(echo "$UI_RELEASE_JSON" | jq -r '.tag_name // empty' 2>/dev/null || true)"
          if [[ -z "$UI_VERSION" || "$UI_VERSION" == "null" ]]; then
            archive_name="$(basename "$ARCHIVE_FILE_PATH")"
            UI_VERSION="$(echo "$archive_name" | grep -oE 'v[0-9][0-9A-Za-z._-]*' | head -n 1 || true)"
          fi
          if [[ -n "$UI_VERSION" && "$UI_VERSION" != "null" && -d "MFA" ]]; then
            printf '%s\n' "$UI_VERSION" > MFA/.mah_ui_version
            echo "Recorded MAH-UI version: $UI_VERSION"
          else
            echo "[WARN] Unable to record MAH-UI version"
          fi

          rm -f "${ARCHIVE_FILE_PATH}"
          echo "Archive cleanup command executed for MAH-UI."

      - name: Remove built-in runtime in MFA
        if: matrix.os != 'android'
        shell: bash
        run: |
          rm -rf MFA/runtimes
      
      - name: Install
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" != "android" ]]; then
            if [ -d "MFA" ]; then
              echo "Copying MFA files to install directory..."
              mkdir -p install
              rsync -av --ignore-existing MFA/ install/
              echo "MFA files copied successfully."
            else
              echo "MFA directory not found, skipping copy."
            fi
          else
            echo "Skipping copy MFA for Android."
          fi

          cd tools/
          python -m pip install -r ./requirements.txt
          python ./install.py ${{ needs.meta.outputs.tag }} ${{ matrix.os }} ${{ matrix.arch }} "${{ steps.sync_resource.outputs.resource_version }}"
          cd ..

          if [[ -f "config/maa_option.json" ]]; then
            mkdir -p install/config
            cp -f "config/maa_option.json" "install/config/maa_option.json"
            echo "Copied config/maa_option.json to install/config"
          else
            echo "[WARNING] config/maa_option.json not found in source repo"
          fi

      - name: Inject embedded python launcher for Windows agent
        if: matrix.os == 'win'
        shell: bash
        run: |
          set -euo pipefail

          runtime_dir=""
          if [[ -d "install/_internal" ]]; then
            runtime_dir="install/_internal"
          fi
          if [[ -z "$runtime_dir" && -d "install/python" ]]; then
            runtime_dir="install/python"
          fi
          if [[ -z "$runtime_dir" ]]; then
            runtime_dir="install/_internal"
            mkdir -p "$runtime_dir"
          fi
          echo "Using windows runtime dir: $runtime_dir"

          py_dll_name=$(find "$runtime_dir" -maxdepth 1 -type f -name "python*.dll" -printf "%f\n" \
            | grep -E '^python[0-9]{3}\.dll$' \
            | sort -V \
            | tail -n1 || true)

          if [[ -z "$py_dll_name" ]]; then
            echo "[ERROR] cannot detect versioned python runtime dll from $runtime_dir"
            echo "[ERROR] existing python*.dll:"
            find "$runtime_dir" -maxdepth 1 -type f -name "python*.dll" -printf "  - %f\n" || true
            exit 1
          fi

          py_tag=$(echo "$py_dll_name" | sed -E 's/^python([0-9]{3})\.dll$/\1/')
          if [[ ! "$py_tag" =~ ^[0-9]{3}$ ]]; then
            echo "[ERROR] unsupported python dll name: $py_dll_name"
            exit 1
          fi

          py_major=${py_tag:0:1}
          py_minor=${py_tag:1:2}
          py_ver="${py_major}.${py_minor}.0"

          embed_arch=""
          case "${{ matrix.arch }}" in
            x86_64)
              embed_arch="amd64"
              ;;
            aarch64)
              embed_arch="arm64"
              ;;
            *)
              echo "[ERROR] unsupported windows arch for embedded python: ${{ matrix.arch }}"
              exit 1
              ;;
          esac

          embed_zip="python-${py_ver}-embed-${embed_arch}.zip"
          embed_url="https://www.python.org/ftp/python/${py_ver}/${embed_zip}"
          std_zip="python${py_tag}.zip"

          need_launcher=0
          need_std_zip=0
          need_ext=0

          [[ -f "$runtime_dir/python.exe" ]] || need_launcher=1
          [[ -f "$runtime_dir/$std_zip" ]] || need_std_zip=1
          [[ -f "$runtime_dir/_ctypes.pyd" ]] || need_ext=1

          need_download=0
          if [[ $need_launcher -eq 1 || $need_std_zip -eq 1 || $need_ext -eq 1 ]]; then
            need_download=1
          fi

          if [[ $need_download -eq 1 ]]; then
            echo "Downloading embedded runtime from: $embed_url"
            curl -fL "$embed_url" -o "/tmp/${embed_zip}"
            unzip -o "/tmp/${embed_zip}" -d "$runtime_dir"
            echo "Injected full embeddable runtime into $runtime_dir"
          fi

          if [[ $need_download -eq 0 ]]; then
            echo "Embedded runtime already complete, skip download"
          fi

          pth_file="$runtime_dir/python${py_tag}._pth"
          {
            if [[ -f "$runtime_dir/$std_zip" ]]; then
              echo "$std_zip"
            fi
            if [[ -f "$runtime_dir/base_library.zip" ]]; then
              echo "base_library.zip"
            fi
            echo "."
            echo "import site"
          } > "$pth_file"
          echo "Generated $pth_file"

          if [[ $need_download -eq 1 ]]; then
            rm -f "/tmp/${embed_zip}"
          fi

          test -f "$runtime_dir/python.exe"
          test -f "$runtime_dir/$std_zip"
          test -f "$runtime_dir/_ctypes.pyd"
          echo "Embedded python launcher injected: $runtime_dir/python.exe"

      - name: Normalize agent child_exec by packaged runtime
        if: matrix.os == 'win'
        shell: bash
        run: |
          set -euo pipefail

          runtime_exec=""
          if [[ -f "install/_internal/python.exe" ]]; then
            runtime_exec="./_internal/python.exe"
          elif [[ -f "install/python/python.exe" ]]; then
            runtime_exec="./python/python.exe"
          else
            echo "[ERROR] no bundled python executable found in install/_internal or install/python"
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          interface_path = Path("install/interface.json")
          data = json.loads(interface_path.read_text(encoding="utf-8"))

          runtime_exec = "./_internal/python.exe"
          if (Path("install/python/python.exe").exists() and not Path("install/_internal/python.exe").exists()):
              runtime_exec = "./python/python.exe"

          def apply_agent_exec(agent_obj):
              if isinstance(agent_obj, dict):
                  agent_obj["child_exec"] = runtime_exec

          agents = data.get("agent")
          if isinstance(agents, dict):
              apply_agent_exec(agents)
          elif isinstance(agents, list):
              for agent_obj in agents:
                  apply_agent_exec(agent_obj)

          interface_path.write_text(
              json.dumps(data, indent=4, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(f"Normalized agent child_exec to: {runtime_exec}")
          PY

      - name: Inject agent pip deps into embedded Python (temporary until next full UI build)
        if: matrix.os == 'win'
        shell: bash
        run: |
          set -euo pipefail

          runtime_dir=""
          if [[ -d "install/_internal" ]]; then
            runtime_dir="install/_internal"
          elif [[ -d "install/python" ]]; then
            runtime_dir="install/python"
          else
            echo "[WARN] no bundled runtime dir, skip agent deps injection"
            exit 0
          fi

          req_file="agent/requirements.txt"
          if [[ ! -f "$req_file" ]]; then
            echo "[WARN] no agent/requirements.txt, skip agent deps injection"
            exit 0
          fi

          # CI 跑在 Ubuntu 上，不能用 Windows 的 python.exe，用系统 Python + --target
          CI_PYTHON=""
          for candidate in python3 python; do
            if command -v "$candidate" &>/dev/null; then
              CI_PYTHON="$candidate"
              break
            fi
          done
          if [[ -z "$CI_PYTHON" ]]; then
            echo "[WARN][agent deps] no system Python found, skip"
            exit 0
          fi

          echo "[agent deps] Installing into $runtime_dir (CI Python: $CI_PYTHON)"
          "$CI_PYTHON" -m pip install -r "$req_file" --target "$runtime_dir"
          # loguru 的 colorama / win32_setctime 依赖在生产环境是 Windows 才需要，
          # Ubuntu CI 端的 pip 可能因 platform 标记跳过它们，这里显式安装。
          for dep in colorama win32-setctime; do
            "$CI_PYTHON" -m pip install "$dep" --target "$runtime_dir" 2>/dev/null || echo "[agent deps] $dep 安装跳过（可能已在目标中）"
          done
          echo "[agent deps] Installation finished."

      - name: Include docs in package root
        shell: bash
        run: |
          if [[ -d "docs" ]]; then
            mkdir -p install/docs
            rsync -av docs/ install/docs/
            echo "Docs copied to install/docs"
          else
            echo "[WARNING] docs directory not found, skipping"
          fi

      - name: Generate release notes for update announcement
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES_RELEASE.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Copy release notes into package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p install/docs/release_note
          if [[ -f CHANGES_RELEASE.md ]]; then
            cp CHANGES_RELEASE.md "install/docs/release_note/${RELEASE_TAG}.md"
            echo "Release notes copied to install/docs/release_note/${RELEASE_TAG}.md"
          else
            echo "## ${RELEASE_TAG}" > "install/docs/release_note/${RELEASE_TAG}.md"
            echo "" >> "install/docs/release_note/${RELEASE_TAG}.md"
            echo "更新公告请查看 [GitHub Releases](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG})" >> "install/docs/release_note/${RELEASE_TAG}.md"
            echo "[WARNING] git-cliff did not produce output, wrote fallback release notes"
          fi

      - name: Inject strenum fallback for Windows package
        if: matrix.os == 'win'
        shell: bash
        run: |
          set -euo pipefail

          runtime_dir=""
          if [[ -d "install/_internal" ]]; then
            runtime_dir="install/_internal"
          elif [[ -d "install/python" ]]; then
            runtime_dir="install/python"
          else
            echo "[ERROR] no bundled runtime dir found for strenum fallback"
            exit 1
          fi

          if ! find "$runtime_dir" -maxdepth 2 \( \
            -type d -name "strenum" -o \
            -type f -name "strenum.py" -o \
            -type d -name "strenum-*.dist-info" -o \
            -type d -name "StrEnum-*.dist-info" \
          \) | grep -q .; then
            printf 'from enum import Enum\n\nclass StrEnum(str, Enum):\n    pass\n' > "$runtime_dir/strenum.py"
            echo "Injected fallback strenum.py into $runtime_dir"
          else
            echo "strenum already bundled, skip fallback injection"
          fi

      - name: Validate packaged files
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ matrix.os }}" == "android" ]]; then
            echo "Skip desktop package validation for android"
            exit 0
          fi

          toolkit_file=""
          case "${{ matrix.os }}" in
            win)
              toolkit_file="install/MaaToolkit.dll"
              ;;
            linux)
              toolkit_file="install/libMaaToolkit.so"
              ;;
            macos)
              toolkit_file="install/libMaaToolkit.dylib"
              ;;
            *)
              echo "[ERROR] unknown desktop os: ${{ matrix.os }}"
              exit 1
              ;;
          esac

          required_files=(
            "install/interface.json"
            "install/icon.png"
            "install/config/maa_option.json"
            "$toolkit_file"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "[ERROR] missing required file: $file"
              missing=1
            fi
          done

          if [[ "${{ matrix.os }}" == "win" ]]; then
            runtime_dir=""
            runtime_exec=""
            if [[ -f "install/_internal/python.exe" ]]; then
              runtime_dir="install/_internal"
              runtime_exec="./_internal/python.exe"
            elif [[ -f "install/python/python.exe" ]]; then
              runtime_dir="install/python"
              runtime_exec="./python/python.exe"
            else
              echo "[ERROR] missing required file: install/_internal/python.exe or install/python/python.exe"
              missing=1
            fi

            if [[ -n "$runtime_dir" ]]; then
              if ! find "$runtime_dir" -maxdepth 1 -type f -name "python[0-9][0-9][0-9]._pth" | grep -q .; then
                echo "[ERROR] missing required file: $runtime_dir/pythonXYZ._pth"
                missing=1
              fi

              py_dll=$(find "$runtime_dir" -maxdepth 1 -type f -name "python*.dll" -printf "%f\n" \
                | grep -E '^python[0-9]{3}\.dll$' \
                | sort -V \
                | tail -n1 || true)
              if [[ -z "$py_dll" ]]; then
                echo "[ERROR] missing required file: $runtime_dir/pythonXYZ.dll"
                missing=1
              else
                py_tag=$(echo "$py_dll" | sed -E 's/^python([0-9]{3})\.dll$/\1/')
                if [[ ! -f "$runtime_dir/python${py_tag}.zip" ]]; then
                  echo "[ERROR] missing required file: $runtime_dir/python${py_tag}.zip"
                  missing=1
                fi
              fi

              if [[ ! -f "$runtime_dir/_ctypes.pyd" ]]; then
                echo "[ERROR] missing required file: $runtime_dir/_ctypes.pyd"
                missing=1
              fi

              if ! EXPECTED_CHILD_EXEC="$runtime_exec" python -c "import json, os; from pathlib import Path; data=json.loads(Path('install/interface.json').read_text(encoding='utf-8')); expected=os.environ['EXPECTED_CHILD_EXEC']; agents=data.get('agent'); vals=[]; vals.extend([agents.get('child_exec')]) if isinstance(agents, dict) else None; vals.extend([i.get('child_exec') for i in agents if isinstance(i, dict)]) if isinstance(agents, list) else None; bad=[v for v in vals if v != expected]; (not bad) or (_ for _ in ()).throw(SystemExit(f'[ERROR] interface agent.child_exec mismatch: expected {expected}, got {bad}')); print(f'Validated interface agent.child_exec: {expected}')"; then
                missing=1
              fi

              vc_dups_found=0
              declare -A seen_vc=()
              while IFS= read -r file; do
                rel="${file#install/}"
                dir_part="$(dirname "$rel")"
                base_part="$(basename "$rel")"
                key="${dir_part,,}/${base_part,,}"

                if [[ -n "${seen_vc[$key]:-}" ]]; then
                  echo "[ERROR] found case-insensitive duplicate vcruntime140 DLLs:"
                  echo "  - install/${seen_vc[$key]}"
                  echo "  - $file"
                  vc_dups_found=1
                else
                  seen_vc[$key]="$rel"
                fi
              done < <(find install -type f -iname "vcruntime140*.dll" | sort)

              if [[ $vc_dups_found -ne 0 ]]; then
                missing=1
              else
                echo "Validated: no case-insensitive duplicate vcruntime140 DLLs"
              fi

              # CI 在 ubuntu 上构建 windows 包，不能直接执行 windows python.exe。
              # 这里改为静态校验：确认关键模块文件已打进包体。
              if [[ ! -d "$runtime_dir/maa" ]]; then
                echo "[ERROR] missing bundled maa package: $runtime_dir/maa"
                missing=1
              fi

              if ! find "$runtime_dir" -maxdepth 2 \( \
                -type d -name "hanzidentifier" -o \
                -type f -name "hanzidentifier.py" -o \
                -type d -name "hanzidentifier-*.dist-info" \
              \) | grep -q .; then
                echo "[ERROR] missing bundled dependency: hanzidentifier"
                echo "[ERROR] runtime_dir top entries (for debug):"
                find "$runtime_dir" -maxdepth 2 -mindepth 1 -printf "  - %p\n" | head -n 80 || true
                missing=1
              fi

              if ! find "$runtime_dir" -maxdepth 2 \( \
                -type d -name "strenum" -o \
                -type f -name "strenum.py" -o \
                -type d -name "strenum-*.dist-info" -o \
                -type d -name "StrEnum-*.dist-info" \
              \) | grep -q .; then
                echo "[ERROR] missing bundled dependency: strenum"
                echo "[ERROR] runtime_dir top entries (for debug):"
                find "$runtime_dir" -maxdepth 2 -mindepth 1 -printf "  - %p\n" | head -n 80 || true
                missing=1
              fi

              if [[ ! -f "$runtime_dir/numpy/__init__.py" ]]; then
                echo "[ERROR] missing bundled dependency: numpy"
                echo "[ERROR] runtime_dir top entries (for debug):"
                find "$runtime_dir" -maxdepth 2 -mindepth 1 -printf "  - %p\n" | head -n 80 || true
                missing=1
              elif ! find "$runtime_dir/numpy" -maxdepth 4 -type f -name "*.pyd" | grep -q .; then
                echo "[ERROR] bundled numpy seems invalid for Windows (no .pyd extension module found)"
                echo "[ERROR] numpy entries (for debug):"
                find "$runtime_dir/numpy" -maxdepth 4 -type f -printf "  - %p\n" | head -n 120 || true
                missing=1
              fi
            fi
          fi

          if [[ $missing -ne 0 ]]; then
            echo "[ERROR] package validation failed"
            exit 1
          fi

          echo "Package validation passed"

      - uses: actions/upload-artifact@v4
        with:
          name: MAH-${{ matrix.os }}-${{ matrix.arch }}
          path: "install"
          retention-days: 1

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.compose_release_body.outputs.release_body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Compose release body with MAH-UI and resource notes
        id: compose_release_body
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAH_UI_REPO: Quartewe/MAH-UI
          DEFAULT_RESOURCE_REPO: quartawa/mah_res
          INPUT_RESOURCE_REPO: ${{ github.event.inputs.resource_repo }}
          INPUT_RESOURCE_REF: ${{ github.event.inputs.resource_ref }}
          TARGET_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail

          resource_repo="$INPUT_RESOURCE_REPO"
          if [[ -z "$resource_repo" ]]; then
            resource_repo="$DEFAULT_RESOURCE_REPO"
          fi

          resource_ref="$INPUT_RESOURCE_REF"
          if [[ -z "$resource_ref" || "$resource_ref" == "main" ]]; then
            resource_api="https://api.github.com/repos/${resource_repo}/releases/latest"
            echo "读取资源版本：使用 ${resource_repo} 最新 release"
          else
            resource_api="https://api.github.com/repos/${resource_repo}/releases/tags/${resource_ref}"
            echo "读取资源版本：使用 ${resource_repo} 的指定 tag ${resource_ref}"
          fi

          resource_json=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$resource_api" || true)
          resource_version=$(echo "$resource_json" | jq -r '.tag_name // empty')
          if [[ -n "$resource_version" ]]; then
            echo "读取到资源版本: $resource_version"
          else
            echo "[WARNING] 未读取到资源版本号，将跳过写入 CI 分类"
          fi

          ui_api_by_tag="https://api.github.com/repos/${MAH_UI_REPO}/releases/tags/${TARGET_TAG}"
          ui_api_latest="https://api.github.com/repos/${MAH_UI_REPO}/releases/latest"
          ui_json=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$ui_api_by_tag" || true)
          ui_version=$(echo "$ui_json" | jq -r '.tag_name // empty')
          if [[ -z "$ui_version" ]]; then
            echo "未找到 MAH-UI 对应 tag ${TARGET_TAG}，回退到 latest"
            ui_json=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" "$ui_api_latest" || true)
            ui_version=$(echo "$ui_json" | jq -r '.tag_name // empty')
          fi

          ui_body=$(echo "$ui_json" | jq -r '.body // empty')
          if [[ -n "$ui_body" ]]; then
            echo "读取到 MAH-UI 更新内容: ${ui_version}"
          else
            echo "[WARNING] 未读取到 MAH-UI 更新内容，将跳过 UI更新 段落"
          fi

          # 获取上一个 MAH release 公告体，用于 UI 更新去重
          previous_release_json=$(curl -fsSL -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" || true)
          previous_release_body=$(echo "$previous_release_json" | jq -r '.body // empty' || true)
          previous_body_file=$(mktemp)
          printf '%s\n' "$previous_release_body" > "$previous_body_file"

          ui_body_file=$(mktemp)
          printf '%s\n' "$ui_body" > "$ui_body_file"

          RESOURCE_VERSION="$resource_version" UI_VERSION="$ui_version" UI_BODY_FILE="$ui_body_file" PREVIOUS_BODY_FILE="$previous_body_file" python - <<'PY'
          import os
          import re
          from pathlib import Path


          HEADING_RE = re.compile(r"^(#{1,6})\s+(.+?)\s*$")


          def normalize_heading_text(text: str) -> str:
              return re.sub(r"\s+", "", text).lower()


          def classify_mah_heading(text: str):
              normalized = normalize_heading_text(text)

              if "新功能" in text or "feat" in normalized:
                  return "feat"
              if "bug修复" in text or "bugfix" in normalized or "修复" in text or "fix" in normalized:
                  return "fix"
              if "持续集成" in text or "持续集成" in normalized or normalized == "ci" or "ci" in normalized:
                  return "ci"
              return None


          def classify_ui_heading(text: str):
              normalized = normalize_heading_text(text)

              if "新增" in text or "新功能" in text or "feat" in normalized:
                  return "feat"
              if "修复" in text or "fix" in normalized:
                  return "fix"
              return None


          def split_sections(markdown: str):
              lines = markdown.replace("\r\n", "\n").split("\n")
              headings = []

              for index, line in enumerate(lines):
                  stripped = line.lstrip()
                  match = HEADING_RE.match(stripped)
                  if match:
                      hashes = match.group(1)
                      title = match.group(2).strip()
                      headings.append((index, hashes, title))

              if not headings:
                  return lines, []

              sections = []
              for pos, (start, hashes, title) in enumerate(headings):
                  end = headings[pos + 1][0] if pos + 1 < len(headings) else len(lines)
                  sections.append(
                      {
                          "hashes": hashes,
                          "title": title,
                          "lines": lines[start:end],
                      }
                  )

              return lines[: headings[0][0]], sections


          def trim_blank_edges(text: str) -> str:
              lines = text.splitlines()
              while lines and not lines[0].strip():
                  lines.pop(0)
              while lines and not lines[-1].strip():
                  lines.pop()
              return "\n".join(lines)


          def extract_ui_updates(raw: str):
              updates = {"feat": "", "fix": ""}
              if not raw.strip():
                  return updates

              _, sections = split_sections(raw)
              if not sections:
                  return updates

              grouped = {"feat": [], "fix": []}
              for section in sections:
                  group = classify_ui_heading(section["title"])
                  if not group:
                      continue

                  body_text = trim_blank_edges("\n".join(section["lines"][1:]))
                  if body_text:
                      grouped[group].append(body_text)

              for key, chunks in grouped.items():
                  if chunks:
                      updates[key] = "\n\n".join(chunks)

              return updates


          def append_line_to_section(section_lines, line: str):
              section_text = "\n".join(section_lines)
              if line in section_text:
                  return section_lines

              updated = section_lines[:]
              insert_at = len(updated)
              while insert_at > 1 and not updated[insert_at - 1].strip():
                  insert_at -= 1
              updated.insert(insert_at, line)
              return updated


          def append_ui_to_section(section_lines, parent_hashes: str, ui_text: str):
              if not ui_text.strip():
                  return section_lines

              section_text = "\n".join(section_lines)
              if re.search(r"(?m)^\s*#{1,6}\s+UI更新[:：]?\s*$", section_text):
                  return section_lines

              updated = section_lines[:]
              while len(updated) > 1 and not updated[-1].strip():
                  updated.pop()

              ui_heading = "#" * min(len(parent_hashes) + 1, 6) + " UI更新:"
              updated.extend(["", ui_heading, ""])
              updated.extend(ui_text.splitlines())
              updated.append("")
              return updated


          def join_sections(prefix_lines, sections) -> str:
              merged_lines = prefix_lines[:]
              for section in sections:
                  merged_lines.extend(section["lines"])
              return "\n".join(merged_lines).rstrip() + "\n"


          def inject_resource_ci(body: str, version: str) -> str:
              if not version:
                  return body

              entry = f"- 资源更新到: {version}"
              prefix_lines, sections = split_sections(body)
              if not sections:
                  stripped = body.rstrip()
                  if stripped:
                      return f"{stripped}\n\n### ⚙️ 持续集成\n{entry}\n"
                  return f"### ⚙️ 持续集成\n{entry}\n"

              ci_index = -1
              for idx, section in enumerate(sections):
                  if classify_mah_heading(section["title"]) == "ci":
                      ci_index = idx
                      break

              if ci_index == -1:
                  merged = join_sections(prefix_lines, sections).rstrip()
                  if merged:
                      return f"{merged}\n\n### ⚙️ 持续集成\n{entry}\n"
                  return f"### ⚙️ 持续集成\n{entry}\n"

              sections[ci_index]["lines"] = append_line_to_section(sections[ci_index]["lines"], entry)
              return join_sections(prefix_lines, sections)


          def inject_ui_updates(body: str, ui_updates, previous_body: str = "") -> str:
              prefix_lines, sections = split_sections(body)
              if not sections:
                  return body

              for section in sections:
                  group = classify_mah_heading(section["title"])
                  if group not in ("feat", "fix"):
                      continue

                  ui_text = ui_updates.get(group, "")
                  if not ui_text:
                      continue

                  # 去重：如果上一次 MAH release 公告中已包含相同 UI 内容，则跳过
                  if previous_body and ui_text.strip() in previous_body:
                      continue

                  section["lines"] = append_ui_to_section(section["lines"], section["hashes"], ui_text)

              return join_sections(prefix_lines, sections)


          base_path = Path("CHANGES.md")
          base_body = base_path.read_text(encoding="utf-8") if base_path.exists() else ""
          resource_version = os.environ.get("RESOURCE_VERSION", "").strip()

          ui_body_file = Path(os.environ["UI_BODY_FILE"])
          ui_raw = ui_body_file.read_text(encoding="utf-8") if ui_body_file.exists() else ""
          ui_updates = extract_ui_updates(ui_raw)

          previous_body_file = Path(os.environ.get("PREVIOUS_BODY_FILE", ""))
          previous_body = previous_body_file.read_text(encoding="utf-8") if previous_body_file.exists() else ""

          merged = inject_resource_ci(base_body, resource_version)
          merged = inject_ui_updates(merged, ui_updates, previous_body)

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          with output_path.open("a", encoding="utf-8") as output_file:
              output_file.write("release_body<<EOF\n")
              output_file.write(merged.rstrip() + "\n")
              output_file.write("EOF\n")
          PY

          rm -f "$ui_body_file" "$previous_body_file"

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: assets

      - run: |
          set -euo pipefail

          find_previous_package_url() {
            local package_prefix="$1"
            local current_tag="$2"

            curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
              | jq -r \
                --arg prefix "${package_prefix}-" \
                --arg current_tag "$current_tag" \
                '[.[]
                  | select(.prerelease == false)
                  | .assets[]?
                  | select(.name | startswith($prefix))
                  | select(.name | endswith(".zip"))
                  | select((.name | test("incremental|hotfix|patch"; "i")) | not)
                  | select((.name | contains($current_tag)) | not)
                  | .browser_download_url
                ][0] // empty'
          }

          extract_ui_version() {
            local root="$1"
            local version_file=""

            if [[ -f "$root/.mah_ui_version" ]]; then
              head -n 1 "$root/.mah_ui_version" | tr -d '\r\n'
              return
            elif [[ -f "$root/app/common/__version__.py" ]]; then
              version_file="$root/app/common/__version__.py"
            elif [[ -f "$root/_internal/app/common/__version__.py" ]]; then
              version_file="$root/_internal/app/common/__version__.py"
            else
              echo ""
              return
            fi

            local parsed=""
            parsed=$(awk -F'"' '/__version__/ {print $2; exit}' "$version_file")
            if [[ -z "$parsed" ]]; then
              parsed=$(awk -F"'" '/__version__/ {print $2; exit}' "$version_file")
            fi
            echo "$parsed"
          }

          find_previous_stable_tag() {
            local source_dir="$1"
            local current_tag="$2"

            git -C "$source_dir" tag --merged HEAD --list "v*" --sort=-v:refname \
              | grep -Evi 'alpha|beta|rc|dev|ci' \
              | grep -vx "$current_tag" \
              | head -n 1 || true
          }

          build_internal_manifest() {
            local root="$1"
            local output="$2"
            : > "$output"

            if [[ ! -d "$root/_internal" ]]; then
              return
            fi

            while IFS= read -r -d '' rel; do
              local path="${rel#./}"
              local digest
              digest=$(sha256sum "$root/$path" | awk '{print $1}')
              printf '%s|%s\n' "$path" "$digest" >> "$output"
            done < <(cd "$root" && find ./_internal -type f -print0 | sort -z)
          }

          mark_mah_changed_path() {
            local path="$1"

            case "$path" in
              agent/*)
                global_agent_changed="true"
                if [[ "$path" == "agent/requirements.txt" ]]; then
                  global_internal_changed="true"
                fi
                ;;
              data/*)
                global_data_changed="true"
                ;;
              config/*)
                global_config_changed="true"
                ;;
              docs/*)
                global_docs_changed="true"
                ;;
              assets/interface.json|assets/interface.jsonc)
                global_interface_changed="true"
                ;;
              assets/icon.png|icon.png|README.md|LICENSE)
                global_root_metadata_changed="true"
                ;;
              assets/index/*|assets/resource/index/*)
                global_index_changed="true"
                ;;
              assets/resource/base/model/*|assets/resource/model/*)
                global_model_changed="true"
                ;;
              assets/resource/base/pipeline/*|assets/resource/pipeline/*|assets/resource/*/pipeline/*)
                global_pipeline_changed="true"
                ;;
              assets/resource/base/image/*|assets/resource/image/*|assets/image/*)
                global_image_changed="true"
                ;;
              assets/resource/*)
                global_resource_other_changed="true"
                ;;
              deps/*|.gitmodules)
                global_deps_changed="true"
                ;;
            esac
          }

          copy_dir_contents() {
            local src="$1"
            local dst="$2"
            if [[ -d "$src" ]]; then
              mkdir -p "$dst"
              rsync -a "$src/" "$dst/"
            fi
          }

          copy_file_if_exists() {
            local src="$1"
            local dst="$2"
            if [[ -f "$src" ]]; then
              mkdir -p "$(dirname "$dst")"
              cp -f "$src" "$dst"
            fi
          }

          copy_root_metadata() {
            local package_root="$1"
            local inc_dir="$2"
            for file_name in README.md LICENSE icon.png; do
              copy_file_if_exists "$package_root/$file_name" "$inc_dir/$file_name"
            done
          }

          copy_dependency_payload() {
            local package_root="$1"
            local inc_dir="$2"
            shopt -s nullglob
            copy_dir_contents "$package_root/libs" "$inc_dir/libs"
            copy_dir_contents "$package_root/plugins" "$inc_dir/plugins"
            for root_file in \
              "$package_root"/Maa*.dll \
              "$package_root"/fastdeploy*.dll \
              "$package_root"/onnxruntime*.dll \
              "$package_root"/opencv*.dll \
              "$package_root"/DirectML.dll \
              "$package_root"/ViGEmClient.dll; do
              copy_file_if_exists "$root_file" "$inc_dir/$(basename "$root_file")"
            done
            shopt -u nullglob
          }

          copy_pipeline_dirs() {
            local package_root="$1"
            local inc_dir="$2"
            local resource_root="$package_root/resource"
            if [[ ! -d "$resource_root" ]]; then
              return
            fi

            while IFS= read -r -d '' pipeline_dir; do
              local rel="${pipeline_dir#"$package_root/"}"
              copy_dir_contents "$pipeline_dir" "$inc_dir/$rel"
            done < <(find "$resource_root" -type d -name pipeline -print0)
          }

          source_dir="$GITHUB_WORKSPACE/source"
          current_tag="${{ needs.meta.outputs.tag }}"
          previous_stable_tag=""
          mah_diff_available="false"

          global_agent_changed="false"
          global_internal_changed="false"
          global_docs_changed="false"
          global_model_changed="false"
          global_pipeline_changed="false"
          global_index_changed="false"
          global_image_changed="false"
          global_resource_other_changed="false"
          # tools/install.py rewrites packaged interface.json with the release
          # tag and resource_version on every build, so every incremental
          # package must carry the generated metadata even when source
          # assets/interface.json did not change.
          global_interface_changed="true"
          global_data_changed="false"
          global_config_changed="false"
          global_root_metadata_changed="false"
          global_deps_changed="false"

          if [[ -d "$source_dir/.git" ]]; then
            git -C "$source_dir" fetch --tags --force
            previous_stable_tag=$(find_previous_stable_tag "$source_dir" "$current_tag")
          fi

          if [[ -n "$previous_stable_tag" ]]; then
            mah_diff_available="true"
            changed_paths_file=$(mktemp)
            git -C "$source_dir" diff --name-only "$previous_stable_tag" HEAD > "$changed_paths_file"
            while IFS= read -r changed_path; do
              [[ -n "$changed_path" ]] || continue
              mark_mah_changed_path "$changed_path"
            done < "$changed_paths_file"
            rm -f "$changed_paths_file"
            echo "[INFO] MAH stable diff: $previous_stable_tag..HEAD"
          else
            echo "[WARN] Unable to find previous stable tag for MAH diff; incremental package will use legacy fallback."
          fi

          echo "[INFO] MAH source flags: agent=$global_agent_changed internal=$global_internal_changed docs=$global_docs_changed model=$global_model_changed pipeline=$global_pipeline_changed index=$global_index_changed image=$global_image_changed resource_other=$global_resource_other_changed interface=$global_interface_changed data=$global_data_changed config=$global_config_changed root_metadata=$global_root_metadata_changed deps=$global_deps_changed"

          cd assets
          for f in *; do
            (cd "$f" && zip -r "../$f-${{ needs.meta.outputs.tag }}.zip" .)

            inc_dir="${f}-incremental"
            rm -rf "$inc_dir"
            mkdir -p "$inc_dir"

            tmp_dir=$(mktemp -d)
            prev_dir="$tmp_dir/previous"
            prev_zip="$tmp_dir/previous.zip"
            mkdir -p "$prev_dir"

            ui_changed="false"
            mah_changed="false"
            fallback_legacy="false"
            agent_changed="$global_agent_changed"
            internal_changed="$global_internal_changed"
            model_changed="$global_model_changed"
            pipeline_changed="$global_pipeline_changed"
            index_changed="$global_index_changed"
            image_changed="$global_image_changed"
            docs_changed="$global_docs_changed"
            resource_other_changed="$global_resource_other_changed"
            interface_changed="$global_interface_changed"
            data_changed="$global_data_changed"
            config_changed="$global_config_changed"
            root_metadata_changed="$global_root_metadata_changed"
            deps_changed="$global_deps_changed"

            if [[ "$mah_diff_available" != "true" ]]; then
              fallback_legacy="true"
            fi

            previous_url=$(find_previous_package_url "$f" "${{ needs.meta.outputs.tag }}" || true)
            if [[ -z "$previous_url" ]]; then
              echo "[WARN] $f 未找到可用于对比的上一个正式包，回退到旧增量逻辑"
              fallback_legacy="true"
            else
              echo "[INFO] $f 上一个对比包: $previous_url"
              curl -fsSL -H "Authorization: token ${GITHUB_TOKEN}" -o "$prev_zip" "$previous_url"
              unzip -o -q "$prev_zip" -d "$prev_dir"

              if [[ "$f" == *android* ]]; then
                echo "[INFO] $f has no bundled MAH-UI, skip UI version comparison"
              else
                current_ui_version=$(extract_ui_version "$f")
                previous_ui_version=$(extract_ui_version "$prev_dir")

                if [[ -n "$current_ui_version" && -n "$previous_ui_version" ]]; then
                  if [[ "$current_ui_version" != "$previous_ui_version" ]]; then
                    ui_changed="true"
                  fi
                  echo "[INFO] $f UI version: current=$current_ui_version previous=$previous_ui_version changed=$ui_changed"
                else
                  ui_changed="true"
                  echo "[WARN] $f UI version metadata incomplete, include UI payload for safety: current='$current_ui_version' previous='$previous_ui_version'"
                fi
              fi

              current_internal_manifest="$tmp_dir/current_mah_internal_manifest.txt"
              previous_internal_manifest="$tmp_dir/previous_mah_internal_manifest.txt"
              build_internal_manifest "$f" "$current_internal_manifest"
              build_internal_manifest "$prev_dir" "$previous_internal_manifest"
              internal_manifest_changed="false"
              if ! cmp -s "$current_internal_manifest" "$previous_internal_manifest"; then
                internal_manifest_changed="true"
                internal_changed="true"
              fi
              echo "[INFO] $f _internal manifest changed=$internal_manifest_changed"

              if [[ "$agent_changed" == "true" || "$internal_changed" == "true" || "$model_changed" == "true" || "$pipeline_changed" == "true" || "$index_changed" == "true" || "$image_changed" == "true" || "$docs_changed" == "true" || "$resource_other_changed" == "true" || "$interface_changed" == "true" || "$data_changed" == "true" || "$config_changed" == "true" || "$root_metadata_changed" == "true" || "$deps_changed" == "true" ]]; then
                mah_changed="true"
              fi
              echo "[INFO] $f MAH changes: agent=$agent_changed internal=$internal_changed model=$model_changed pipeline=$pipeline_changed index=$index_changed image=$image_changed docs=$docs_changed resource_other=$resource_other_changed interface=$interface_changed data=$data_changed config=$config_changed root_metadata=$root_metadata_changed deps=$deps_changed"
            fi

            if [[ "$fallback_legacy" == "true" ]]; then
              rsync -a "$f/" "$inc_dir/"
              rm -rf "$inc_dir/resource/index"
              rm -rf "$inc_dir/resource/base/image/ar"
              rm -rf "$inc_dir/resource/base/image/character"
            else
              if [[ "$ui_changed" == "true" ]]; then
                # UI变更：仅打包UI构建产物，排除_internal与MAH目录
                rsync -a \
                  --exclude='_internal/' \
                  --exclude='agent/' \
                  --exclude='resource/' \
                  --exclude='docs/' \
                  --exclude='data/' \
                  --exclude='config/' \
                  --exclude='libs/' \
                  --exclude='plugins/' \
                  --exclude='interface.json' \
                  --exclude='interface.jsonc' \
                  --exclude='icon.png' \
                  --exclude='README.md' \
                  --exclude='LICENSE' \
                  "$f/" "$inc_dir/"
              fi

              if [[ "$mah_changed" == "true" ]]; then
                # 按变更粒度增量打包，避免重复打入未变更的大文件（ONNX模型等）
                if [[ "$agent_changed" == "true" ]]; then
                  copy_dir_contents "$f/agent" "$inc_dir/agent"
                fi
                if [[ "$internal_manifest_changed" == "true" && -d "$f/_internal" ]]; then
                  declare -A prev_internal_hash=()
                  while IFS='|' read -r path hash; do
                    [[ -n "$path" ]] || continue
                    prev_internal_hash["$path"]="$hash"
                  done < "$previous_internal_manifest"

                  changed_count=0
                  while IFS='|' read -r path hash; do
                    [[ -n "$path" ]] || continue
                    if [[ "${prev_internal_hash[$path]:-}" != "$hash" ]]; then
                      dest="$inc_dir/$path"
                      mkdir -p "$(dirname "$dest")"
                      cp "$f/$path" "$dest"
                      changed_count=$((changed_count + 1))
                    fi
                  done < "$current_internal_manifest"

                  echo "[INFO] $f _internal incremental: included ${changed_count} changed files"
                fi
                if [[ "$docs_changed" == "true" ]]; then
                  copy_dir_contents "$f/docs" "$inc_dir/docs"
                fi
                if [[ "$data_changed" == "true" ]]; then
                  copy_dir_contents "$f/data" "$inc_dir/data"
                fi
                if [[ "$config_changed" == "true" ]]; then
                  copy_dir_contents "$f/config" "$inc_dir/config"
                fi
                if [[ "$root_metadata_changed" == "true" ]]; then
                  copy_root_metadata "$f" "$inc_dir"
                fi
                if [[ "$deps_changed" == "true" ]]; then
                  copy_dependency_payload "$f" "$inc_dir"
                fi
                if [[ "$index_changed" == "true" ]]; then
                  copy_dir_contents "$f/resource/index" "$inc_dir/resource/index"
                fi
                if [[ "$image_changed" == "true" ]]; then
                  copy_dir_contents "$f/resource/base/image" "$inc_dir/resource/base/image"
                fi
                if [[ "$model_changed" == "true" ]]; then
                  copy_dir_contents "$f/resource/base/model" "$inc_dir/resource/base/model"
                fi
                if [[ "$pipeline_changed" == "true" ]]; then
                  copy_pipeline_dirs "$f" "$inc_dir"
                fi
                if [[ "$resource_other_changed" == "true" && -d "$f/resource" ]]; then
                  rsync -a \
                    --exclude='index/' \
                    --exclude='base/image/' \
                    --exclude='base/model/' \
                    --exclude='base/pipeline/' \
                    --exclude='*/pipeline/' \
                    "$f/resource/" "$inc_dir/resource/"
                fi
                if [[ "$interface_changed" == "true" ]]; then
                  for pi_file in interface.json interface.jsonc; do
                    if [[ -f "$f/$pi_file" ]]; then
                      cp "$f/$pi_file" "$inc_dir/$pi_file"
                    fi
                  done
                fi
              fi

              # 两者都未变化时仍产出一个可追踪的增量包
              if [[ "$ui_changed" != "true" && "$mah_changed" != "true" ]]; then
                echo "No UI or MAH changes detected." > "$inc_dir/NO_INCREMENTAL_CHANGES.txt"
              fi
            fi

            # _internal/ 始终与上一正式完整包逐文件比较，只打包新增或哈希变化的文件。

            (cd "$inc_dir" && zip -r "../$f-incremental-${{ needs.meta.outputs.tag }}.zip" .)
            rm -rf "$inc_dir" "$tmp_dir"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        # if: ${{ github.repository_owner == 'MaaXYZ' }}
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
